<style>
#ct-six{--ct-bg:#10151d;--ct-panel:#1c2531;--ct-well:#131b25;--ct-control:#283647;--ct-text:#f4eee2;--ct-muted:#c2c6cc;--ct-metal:#d5b77c;--ct-lip:#87734d;--ct-edge:#8895a6;--ct-error:#ffb4a8;padding:16px 0}
#ct-six [hidden]{display:none!important}
#ct-six .ct-device{box-sizing:border-box;width:100%;max-width:736px;margin:auto;padding:8px;background:var(--ct-bg);color:var(--ct-text);color-scheme:dark;border-radius:22px;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;box-shadow:0 16px 36px #0003}
#ct-six .ct-gameplay{position:relative}#ct-six .ct-hub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;justify-content:center}#ct-six .ct-hub .ct-menu-trigger{display:flex;align-items:center;justify-content:center;width:48px;height:48px;padding:6px;border:2px solid var(--ct-metal);border-radius:50%;background:var(--ct-control);box-shadow:0 0 0 3px var(--ct-bg),inset 0 0 0 1px var(--ct-lip)}#ct-six .ct-menu-trigger img{display:block;max-width:100%;border-radius:50%;pointer-events:none}#ct-six h2{font-size:19px;line-height:1.2;margin:0;font-weight:600}#ct-six .ct-sub{font-size:12px;line-height:1.4;color:var(--ct-muted)}
#ct-six .ct-menu{box-sizing:border-box;width:calc(100% - 32px);max-width:360px;max-height:calc(100% - 32px);padding:20px;border:1px solid var(--ct-metal);border-radius:16px;background:var(--ct-panel);color:var(--ct-text);font-family:inherit;color-scheme:dark}#ct-six .ct-menu::backdrop{background:#0009}#ct-six .ct-menu [data-menu-close]{display:block;margin-top:12px}#ct-six select,#ct-six input{font-family:inherit;font-size:16px;min-height:48px;min-width:0;max-width:100%;box-sizing:border-box;background:var(--ct-control);color:var(--ct-text);border:1px solid var(--ct-edge);border-radius:8px;padding:8px}
#ct-six .ct-action{font-family:inherit;min-width:48px;min-height:48px;border:1px solid var(--ct-edge);border-radius:8px;background:var(--ct-control);color:var(--ct-text);font-size:14px;padding:6px 10px;touch-action:manipulation}#ct-six .ct-action:disabled{opacity:.5}#ct-six .ct-action:active{background:var(--ct-well)}
#ct-six .ct-board{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;grid-auto-rows:1fr;aspect-ratio:2/1;min-height:344px}#ct-six .ct-frame{--corner-tl:18px;--corner-tr:18px;--corner-br:18px;--corner-bl:18px;position:relative;border:2px solid var(--ct-metal);border-radius:var(--corner-tl) var(--corner-tr) var(--corner-br) var(--corner-bl);padding:2px;background:linear-gradient(135deg,#7c6944,var(--ct-well) 35%,#8f784d);box-sizing:border-box;min-width:0;min-height:168px}
#ct-six .ct-frame:nth-child(1){--corner-br:56px}#ct-six .ct-frame:nth-child(2){--corner-bl:56px}#ct-six .ct-frame:nth-child(3){--corner-tr:56px}#ct-six .ct-frame:nth-child(4){--corner-tl:56px}
#ct-six .ct-frame:before{content:'';position:absolute;width:28px;height:4px;top:-3px;left:calc(50% - 14px);background:var(--ct-well);border:1px solid var(--ct-metal);border-bottom:0;pointer-events:none;border-radius:3px 3px 0 0}
#ct-six .ct-frame-inner{display:flex;flex-direction:column;height:100%;box-sizing:border-box;padding:0;border:1px solid var(--ct-lip);border-radius:calc(var(--corner-tl) - 5px) calc(var(--corner-tr) - 5px) calc(var(--corner-br) - 5px) calc(var(--corner-bl) - 5px);background:var(--ct-panel)}
#ct-six .ct-nameplate{display:flex;align-items:center;justify-content:space-between;gap:6px;min-height:48px;box-shadow:inset 0 0 0 1px var(--ct-metal);border-radius:16px 16px 10px 10px;padding-left:10px;background:linear-gradient(#303c4a,var(--ct-panel));box-sizing:border-box}
#ct-six .ct-nameplate h3{font-size:16px;font-weight:600;line-height:1.25;margin:0;overflow-wrap:anywhere;min-width:0}#ct-six .ct-seat{color:var(--ct-metal);font-size:11px;margin-right:6px;font-weight:500}#ct-six .ct-trackers{min-height:48px;min-width:76px;padding:4px 8px;border:1px solid var(--ct-edge);border-radius:10px;background:var(--ct-control);color:var(--ct-text);font-size:12px;font-family:inherit;touch-action:manipulation}
#ct-six .ct-life-well{display:flex;flex-direction:column;flex:1;position:relative;border-radius:20px 20px calc(var(--corner-br) - 6px) calc(var(--corner-bl) - 6px);background:var(--ct-well);border:1px solid var(--ct-edge)}
#ct-six .ct-zone{display:block;box-sizing:border-box;width:100%;min-height:48px;border:0;background:var(--ct-well);color:var(--ct-muted);font:500 13px system-ui;text-align:right;padding:8px 12px;touch-action:manipulation}
#ct-six .ct-zone:first-child{border-radius:20px 20px 0 0;border-bottom:1px solid var(--ct-edge)}#ct-six .ct-zone[data-delta="-1"]{border-radius:0 0 9px 9px}#ct-six .ct-zone:active{background:var(--ct-control)}
#ct-six .ct-life-value{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:56px;line-height:1.05;font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:-2px;pointer-events:none;background:var(--ct-well);padding:0 8px;color:var(--ct-text)}
#ct-six .ct-status{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
#ct-six .ct-roster{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}#ct-six .ct-roster button[aria-pressed=true]{border:2px solid var(--ct-metal)}
#ct-six .ct-device[data-layout=table] .ct-frame:nth-child(-n+2){transform:rotate(180deg)}#ct-six .ct-device[data-layout=focus] .ct-board{grid-template-columns:minmax(0,1fr);max-width:410px;margin:auto}
#ct-six .ct-device[data-layout=focus] .ct-hub{position:static;transform:none;margin:8px auto 0}
#ct-six .ct-zone{flex:1}#ct-six .ct-zone[data-delta="-1"]{border-bottom-right-radius:calc(var(--corner-br) - 7px);border-bottom-left-radius:calc(var(--corner-bl) - 7px)}
#ct-six .ct-nameplate{flex-shrink:0;border-top-left-radius:calc(var(--corner-tl) - 6px);border-top-right-radius:calc(var(--corner-tr) - 6px)}
#ct-six .ct-frame:nth-child(3) .ct-trackers{margin-right:28px}#ct-six .ct-frame:nth-child(4) .ct-nameplate{padding-left:32px}
#ct-six .ct-device[data-layout=table] .ct-frame:nth-child(1){--corner-br:18px;--corner-tl:56px}#ct-six .ct-device[data-layout=table] .ct-frame:nth-child(2){--corner-bl:18px;--corner-tr:56px}

<script>
(()=>{
const root=document.getElementById('ct-six');const device=root.querySelector('.ct-device');const board=root.querySelector('.ct-board');const inspector=root.querySelector('.ct-inspector');const rows=root.querySelector('.ct-rows');const status=root.querySelector('[data-status]');const roster=root.querySelector('.ct-roster');
const menu=root.querySelector('.ct-menu');const menuTrigger=root.querySelector('[data-menu-open]');
function closeMenu(){menu.close();menuTrigger.setAttribute('aria-expanded','false');menuTrigger.focus();}
menu.addEventListener('close',()=>{menuTrigger.setAttribute('aria-expanded','false');menuTrigger.focus();});
const players=Array.from({length:6},(_,i)=>({id:'p'+(i+1),name:'Player '+(i+1),life:[37,40,35,42,28,46][i],counts:[{id:'poison',name:'Poison',value:i===0?2:0,min:0},{id:'energy',name:'Energy',value:i===0?3:0,min:0},{id:'experience',name:'Experience',value:0,min:0}]}));
const commanders=players.flatMap((p,i)=>[{id:p.id+'-a',label:p.name+' · Commander A'},...(i===1?[{id:p.id+'-b',label:p.name+' · Commander B'}]:[])]);const damages={};let selected=0;let receipt=null;let customId=0;const blocked=new WeakMap();const pointers=new Map();
const source=root.querySelector('[data-source]');commanders.forEach(commander=>{const option=document.createElement('option');option.value=commander.id;option.textContent=commander.label;source.append(option);});source.value='p2-a';
function announce(message){status.textContent=message;}
function cancelAll(){pointers.forEach(point=>blocked.set(point.button,true));pointers.clear();}
root.addEventListener('pointerdown',event=>{const button=event.target.closest('.ct-zone');if(!button)return;blocked.set(button,false);pointers.set(event.pointerId,{button,x:event.clientX,y:event.clientY});if(pointers.size>1)pointers.forEach(point=>blocked.set(point.button,true));});
root.addEventListener('pointermove',event=>{const point=pointers.get(event.pointerId);if(point&&Math.hypot(event.clientX-point.x,event.clientY-point.y)>10)blocked.set(point.button,true);});
root.addEventListener('pointercancel',event=>{const point=pointers.get(event.pointerId);if(point)blocked.set(point.button,true);pointers.delete(event.pointerId);});root.addEventListener('pointerup',event=>pointers.delete(event.pointerId));
window.addEventListener('resize',cancelAll);document.addEventListener('visibilitychange',cancelAll);
function change(object,key,delta,min,label){const old=object[key]??0;const next=min===null?old+delta:Math.max(min,old+delta);object[key]=next;if(next!==old)receipt={object,key,delta:next-old,label};update();announce(label+' '+next);}
function update(){
inspector.dataset.facing=selected<3?'far':'near';
board.querySelectorAll('[data-player]').forEach(frame=>{const i=Number(frame.dataset.player);frame.querySelector('output').textContent=players[i].life;frame.hidden=device.dataset.layout==='focus'&&i!==selected;});
root.querySelector('[data-undo]').disabled=!receipt;
root.querySelector('[data-undo-detail]').textContent=receipt?receipt.label+' '+(receipt.delta>0?'+':'')+receipt.delta:'No adjustment to undo.';
rows.querySelectorAll('[data-count-id]').forEach(row=>{const count=players[selected].counts.find(item=>item.id===row.dataset.countId);if(count)row.querySelector('output').textContent=count.value;});
const key=source.value+'>'+players[selected].id;root.querySelector('[data-damage-value]').textContent=damages[key]??0;root.querySelector('[data-pair]').textContent=commanders.find(item=>item.id===source.value).label+' → '+players[selected].name;
roster.querySelectorAll('[data-seat]').forEach(button=>{const i=Number(button.dataset.seat);button.textContent=players[i].name+' · '+players[i].life;button.setAttribute('aria-pressed',String(i===selected));});
}
function buildRows(){rows.replaceChildren();players[selected].counts.forEach(count=>{const row=document.createElement('div');row.className='ct-row';row.dataset.countId=count.id;const name=document.createElement('span');name.textContent=count.name;row.append(name);[-1,0,1].forEach(delta=>{const element=document.createElement(delta===0?'output':'button');if(delta===0){element.textContent=count.value;element.setAttribute('aria-label',players[selected].name+' '+count.name);}else{element.className='ct-action cursor-interaction';element.type='button';element.textContent=delta>0?'+':'−';element.dataset.countDelta=delta;element.setAttribute('aria-label',(delta>0?'Increase ':'Decrease ')+count.name+' for '+players[selected].name);}row.append(element);});rows.append(row);});root.querySelector('[data-inspector-title]').textContent=players[selected].name+' · Trackers';update();}
players.forEach((player,i)=>{
const frame=document.createElement('article');frame.className='ct-frame';frame.dataset.player=i;frame.setAttribute('aria-label',player.name);frame.innerHTML='<div class="ct-frame-inner"><div class="ct-nameplate"><h3></h3><button class="ct-trackers cursor-interaction"><img src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyMiIgaGVpZ2h0PSIyMiIgdmlld0JveD0iMCAwIDI0IDI0IiBmaWxsPSJub25lIiBzdHJva2U9IiNkNWI3N2MiIHN0cm9rZS13aWR0aD0iMiIgc3Ryb2tlLWxpbmVjYXA9InJvdW5kIiBzdHJva2UtbGluZWpvaW49InJvdW5kIiBhcmlhLWhpZGRlbj0idHJ1ZSI+CjxwYXRoIGQ9Ik0xMi44MyAyLjE4YTIgMiAwIDAgMC0xLjY2IDBMMi42IDYuMDhhMSAxIDAgMCAwIDAgMS44M2w4LjU4IDMuOTFhMiAyIDAgMCAwIDEuNjYgMGw4LjU4LTMuOWExIDEgMCAwIDAgMC0xLjgzeiIvPgo8cGF0aCBkPSJNMiAxMmExIDEgMCAwIDAgLjU4LjkxbDguNiAzLjkxYTIgMiAwIDAgMCAxLjY1IDBsOC41OC0zLjlBMSAxIDAgMCAwIDIyIDEyIi8+CjxwYXRoIGQ9Ik0yIDE3YTEgMSAwIDAgMCAuNTguOTFsOC42IDMuOTFhMiAyIDAgMCAwIDEuNjUgMGw4LjU4LTMuOUExIDEgMCAwIDAgMjIgMTciLz4KPC9zdmc+Cg==" width="22" height="22" alt="" aria-hidden="true"></button></div><div class="ct-life-well"><button class="ct-zone cursor-interaction" data-delta="1">+1</button><button class="ct-zone cursor-interaction" data-delta="-1">−1</button><output class="ct-life-value"></output></div></div>';
const seat=document.createElement('span');seat.className='ct-seat';seat.textContent=String(i+1).padStart(2,'0');frame.querySelector('h3').append(seat,player.name);frame.querySelector('.ct-trackers').setAttribute('aria-label','Trackers for '+player.name);frame.querySelector('output').setAttribute('aria-label',player.name+' life');frame.querySelectorAll('.ct-zone').forEach(button=>button.setAttribute('aria-label',(Number(button.dataset.delta)>0?'Increase':'Decrease')+' life for '+player.name));if(i<3){frame.dataset.row='far';frame.querySelector('.ct-frame-inner').append(frame.querySelector('.ct-nameplate'));}frame.querySelectorAll('.ct-zone').forEach(button=>{const label=document.createElement('span');label.textContent=button.textContent;button.replaceChildren(label);});board.append(frame);
const choose=document.createElement('button');choose.className='ct-action cursor-interaction';choose.dataset.seat=i;roster.append(choose);
});
root.addEventListener('click',event=>{
if(event.target.closest('[data-menu-open]')){cancelAll();menu.showModal();menuTrigger.setAttribute('aria-expanded','true');return;}
if(event.target.closest('[data-menu-close]')){closeMenu();return;}
const undo=event.target.closest('[data-undo]');if(undo&&receipt){const saved=receipt;saved.object[saved.key]-=saved.delta;receipt=null;update();closeMenu();announce('Undid '+saved.label);return;}
const zone=event.target.closest('.ct-zone');if(zone){if(event.detail>0&&blocked.get(zone))return;const i=Number(zone.closest('[data-player]').dataset.player);change(players[i],'life',Number(zone.dataset.delta),null,players[i].name+' life');return;}
const entry=event.target.closest('.ct-trackers');if(entry){selected=Number(entry.closest('[data-player]').dataset.player);inspector.hidden=false;cancelAll();buildRows();announce(players[selected].name+' trackers opened');return;}
if(event.target.closest('[data-close]')){inspector.hidden=true;board.querySelector('[data-player="'+selected+'"] .ct-trackers').focus();return;}
const choose=event.target.closest('[data-seat]');if(choose){selected=Number(choose.dataset.seat);buildRows();announce(players[selected].name+' selected');return;}
const countButton=event.target.closest('[data-count-delta]');if(countButton){const count=players[selected].counts.find(item=>item.id===countButton.closest('[data-count-id]').dataset.countId);change(count,'value',Number(countButton.dataset.countDelta),count.min,players[selected].name+' '+count.name);return;}
const damageButton=event.target.closest('[data-damage]');if(damageButton){const key=source.value+'>'+players[selected].id;change(damages,key,Number(damageButton.dataset.damage),0,root.querySelector('[data-pair]').textContent+' damage');}
});
root.querySelector('select[data-layout]').addEventListener('change',event=>{cancelAll();device.dataset.layout=event.target.value;roster.hidden=event.target.value!=='focus';update();announce('Layout '+event.target.selectedOptions[0].textContent);});
root.querySelector('[data-mode]').addEventListener('change',event=>{root.querySelector('[data-count-view]').hidden=event.target.value!=='counts';root.querySelector('[data-damage-view]').hidden=event.target.value!=='damage';});source.addEventListener('change',update);
function addTracker(event){event.preventDefault();const input=root.querySelector('[data-custom-name]');const name=input.value.trim();if(!name){root.querySelector('[data-error]').textContent='Enter a tracker name.';return;}players[selected].counts.push({id:'custom-'+(++customId),name,value:0,min:0});input.value='';root.querySelector('[data-error]').textContent='';buildRows();announce(name+' added for '+players[selected].name);}
root.querySelector('.ct-add').addEventListener('submit',addTracker);root.querySelector('[data-add]').addEventListener('click',addTracker);root.querySelector('[data-custom-name]').addEventListener('keydown',event=>{if(event.key==='Enter')addTracker(event);});
device.dataset.layout='table';root.querySelector('select[data-layout]').value='table';buildRows();
root.querySelector('.ct-menu .ct-sub').textContent='6 players';
function fitNotches(){
const wide=!window.matchMedia('(max-width:600px)').matches&&device.dataset.layout!=='focus';
board.querySelectorAll('article').forEach((frame,i)=>{
if(!wide||(i!==1&&i!==4)){frame.style.clipPath='none';return;}
const w=frame.getBoundingClientRect().width,h=frame.getBoundingClientRect().height,cx=w/2,r=30,halfGap=4,angle=Math.asin(halfGap/r),points=[];
const top=i===4;
if(top){points.push([0,0]);for(let n=0;n<=32;n++){const a=Math.PI-angle-(Math.PI-2*angle)*n/32;points.push([cx+r*Math.cos(a),-halfGap+r*Math.sin(a)]);}points.push([w,0],[w,h],[0,h]);}
else{points.push([0,0],[w,0],[w,h]);for(let n=0;n<=32;n++){const a=-angle-(Math.PI-2*angle)*n/32;points.push([cx+r*Math.cos(a),h+halfGap+r*Math.sin(a)]);}points.push([0,h]);}
frame.style.clipPath='polygon('+points.map(p=>p[0]+'px '+p[1]+'px').join(',')+')';
});
}
new ResizeObserver(fitNotches).observe(board);root.querySelector('select[data-layout]').addEventListener('change',()=>requestAnimationFrame(fitNotches));fitNotches();

})();
</script>
